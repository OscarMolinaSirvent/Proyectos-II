<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Niryo Control</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .login-card { max-width: 400px; margin: 100px auto; padding: 20px; text-align: center; }
        .input-login { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        .btn-login { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card login-card">
        <img src="upv.png" alt="UPV" style="width: 100px;">
        <h2>Acceso al Sistema</h2>
        <input type="text" id="user" class="input-login" placeholder="Usuario">
        <input type="password" id="pass" class="input-login" placeholder="Contraseña">
        <button id="btnLogin" class="btn-login">ENTRAR</button>
        <p id="error-msg" style="color: red; display: none;"></p>
    </div>

    <script>
        document.getElementById("btnLogin").onclick = async () => {
            const usuario = document.getElementById("user").value;
            const password = document.getElementById("pass").value;

            const response = await fetch("http://127.0.0.1:5000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario, password })
            });

            const data = await response.json();

            if (data.success) {
                // Guardamos el tipo de usuario en el navegador
                sessionStorage.setItem("userRole", data.tipo);
                window.location.href = "index.html";
            } else {
                const error = document.getElementById("error-msg");
                error.innerText = data.message;
                error.style.display = "block";
            }
        };
    </script>
</body>
</html>
